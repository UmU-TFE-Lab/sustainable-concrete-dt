[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sustainable-concrete-dt"
version = "0.2.0"
description = "Reproducible statistical, AI, digital-twin, and optimization methods for low-carbon concrete"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy==2.0.2",
  "pandas==2.3.3",
  "scipy==1.13.1",
  "scikit-learn==1.6.1",
  "matplotlib==3.9.4",
  "joblib==1.5.3",
  "pymoo==0.6.1.3",
  "rdflib==7.1.4",
  "owlrl==7.1.4",
  "pyshacl==0.30.1",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
full = [
  "xgboost==2.1.4",
  "codecarbon==3.2.3",
]
test = [
  "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
